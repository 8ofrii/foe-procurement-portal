    <meta charset="UTF-8" />
    <!-- Flash-of-wrong-language / theme prevention: read localStorage BEFORE React hydrates -->
    <script>
      (function () {
        var lang = localStorage.getItem('foe_lang') || 'ar';
        var zoom = localStorage.getItem('foe_zoom') || '0.9';
        var theme = localStorage.getItem('foe_theme') || 'dark';
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
        document.documentElement.style.zoom = zoom;
        document.documentElement.classList.add(theme);
      })();
    </script>
