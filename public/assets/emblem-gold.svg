<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <radialGradient id="emblemBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141f36" />
      <stop offset="100%" stop-color="#070c18" />
    </radialGradient>
    <linearGradient id="goldMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="furrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Ring Shadow and Glow -->
  <circle cx="60" cy="60" r="54" fill="url(#emblemBg)" stroke="url(#goldMetallic)" stroke-width="4" filter="url(#goldGlow)" />
  <circle cx="60" cy="60" r="48" stroke="url(#goldMetallic)" stroke-width="1.5" stroke-dasharray="2 3" opacity="0.6" />

  <!-- Radiating Sun Rays (8 official rays) -->
  <g stroke="url(#goldMetallic)" stroke-width="3.5" stroke-linecap="round">
    <!-- Top Ray -->
    <line x1="60" y1="18" x2="60" y2="30" />
    <!-- Diagonal Rays -->
    <line x1="38" y1="24" x2="45" y2="34" />
    <line x1="82" y1="24" x2="75" y2="34" />
    <!-- Lower Diagonal Rays -->
    <line x1="22" y1="40" x2="33" y2="46" />
    <line x1="98" y1="40" x2="87" y2="46" />
    <!-- Horizontal Rays -->
    <line x1="16" y1="58" x2="28" y2="58" />
    <line x1="104" y1="58" x2="92" y2="58" />
  </g>

  <!-- Central Rising Sun Dome -->
  <path d="M42 58 A 18 18 0 0 1 78 58 Z" fill="url(#goldMetallic)" />

  <!-- Agricultural Furrows (New Delta Fields) -->
  <g stroke="url(#goldMetallic)" stroke-width="3" stroke-linecap="round" fill="none">
    <!-- Top Field Furrow Line -->
    <path d="M18 60 Q 60 76 102 60" />
    <!-- Second Furrow Line -->
    <path d="M22 74 Q 60 92 98 74" />
    <!-- Third Furrow Line -->
    <path d="M30 88 Q 60 102 90 88" />
    <!-- Perspective radial furrow separators -->
    <line x1="60" y1="74" x2="60" y2="96" stroke-width="2" opacity="0.7" />
    <line x1="44" y1="70" x2="38" y2="84" stroke-width="2" opacity="0.7" />
    <line x1="76" y1="70" x2="82" y2="84" stroke-width="2" opacity="0.7" />
  </g>
</svg>
